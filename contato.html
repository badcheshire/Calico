<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisãoAcolhedora | Contato</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="accessibility-bar">

    <div class="accessibility-content">

        <span>Acessibilidade:</span>

        <button id="decreaseFont">A−</button>

        <button id="increaseFont">A+</button>

        <button id="contrastButton">
            Contraste
        </button>

        <button id="darkMode">
            Modo escuro
        </button>

        <button id="spacingButton">
            Espaçamento
        </button>

    </div>

</div>


<header class="header">

    <div class="container nav-container">

        <a href="index.html" class="logo">

            <span class="logo-icon">

                <svg viewBox="0 0 100 100">

                    <circle
                        cx="50"
                        cy="50"
                        r="38"
                        fill="#d81b60"/>

                    <circle
                        cx="50"
                        cy="50"
                        r="15"
                        fill="white"/>

                </svg>

            </span>

            <span>
                Visão<span>Acolhedora</span>
            </span>

        </a>


        <div class="eye-wrapper">

            <div
                id="eyeFollower"
                class="eyeFollower">
            </div>

        </div>


        <button
            class="menu-button"
            aria-expanded="false">

            ☰

        </button>


        <nav>

            <a href="index.html">Início</a>

            <a href="sobre.html">Sobre</a>

            <a href="causas.html">Causas</a>

            <a href="tecnologia.html">Tecnologia</a>

            <a href="recursos.html">Recursos</a>

            <a href="faq.html">FAQ</a>

            <a href="contato.html">Contato</a>

        </nav>

    </div>

</header>


<main>


<section class="page-hero">

    <div class="container">

        <span class="badge">
            FALE CONOSCO
        </span>

        <h1>
            Entre em
            <span>contato</span>
        </h1>

        <p>
            Tem alguma dúvida, sugestão ou comentário?
            Envie uma mensagem.
        </p>

    </div>

</section>


<section class="section">

    <div class="container contact-container">


        <form
            class="contact-form"
            action="https://api.web3forms.com/submit"
            method="POST">


            <!-- COLOQUE SUA ACCESS KEY AQUI -->

            <input
                type="hidden"
                name="access_key"
                value="SUA_ACCESS_KEY_AQUI">


            <input
                type="hidden"
                name="subject"
                value="Nova mensagem — VisãoAcolhedora">


            <input
                type="hidden"
                name="from_name"
                value="VisãoAcolhedora">


            <label for="name">
                Nome
            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Digite seu nome"
                required>


            <label for="email">
                E-mail
            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required>


            <label for="message">
                Mensagem
            </label>


            <textarea
                id="message"
                name="message"
                placeholder="Digite sua mensagem"
                required></textarea>


            <button
                type="submit"
                class="button primary">

                Enviar mensagem

            </button>

        </form>

    </div>

</section>


</main>


<footer>

    <div class="container footer-content">

        <div>

            <strong>
                VisãoAcolhedora
            </strong>

            <p>
                Informação, acessibilidade e inclusão.
            </p>

        </div>


        <p>
            © 2026 VisãoAcolhedora
        </p>

    </div>

</footer>


<button id="topButton">
    ↑
</button>


<script src="script.js"></script>

</body>

</html>
